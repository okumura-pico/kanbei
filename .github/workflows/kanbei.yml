name: Kanbei — autonomous issue driver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

# Prevent concurrent runs on the same issue.
concurrency:
  group: kanbei-issue-${{ github.event.issue.number }}
  cancel-in-progress: false   # queue rather than cancel; let each run finish

jobs:
  drive:
    name: Drive issue #${{ github.event.issue.number }}
    runs-on: ubuntu-latest

    # Only run when a kanbei: phase label is present, OR when a human
    # replies on an issue that is in the awaiting-human phase.
    # The orchestrator itself checks KANBEI_DISABLED and safety caps.
    if: |
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'kanbei:')) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       contains(toJson(github.event.issue.labels), '"kanbei:awaiting-human"'))

    permissions:
      contents: write        # push branches
      issues: write          # read/write labels and comments
      pull-requests: write   # open PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history lets kanbei branch from any ref.
          fetch-depth: 0
          token: ${{ secrets.KANBEI_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run kanbei
        env:
          # GitHub App credentials — store these as repo secrets.
          KANBEI_APP_ID:              ${{ secrets.KANBEI_APP_ID }}
          KANBEI_APP_INSTALLATION_ID: ${{ secrets.KANBEI_APP_INSTALLATION_ID }}
          KANBEI_APP_PRIVATE_KEY:     ${{ secrets.KANBEI_APP_PRIVATE_KEY }}
          # Anthropic API key for Claude.
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_URL="${{ github.event.issue.html_url }}"
          echo "::notice::Running kanbei on ${ISSUE_URL}"
          npx tsx src/cli/index.ts run "${ISSUE_URL}"
